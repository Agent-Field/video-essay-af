name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Dockerfile

      - name: Install deps + ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Compile
        run: python -m py_compile main.py reasoners/*.py media/*.py

      - name: Lint
        run: ruff check .

      # The compose file reads every key from .env; the example file is enough to
      # validate the stack definition (no containers are started here).
      - name: Validate docker compose
        run: |
          cp .env.example .env
          docker compose config -q
